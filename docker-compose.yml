services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - site
    networks:
      - stack

  site:
    build:
      context: ./site
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - path: ./secrets/.env.checkout
        required: false
    environment:
      - NODE_ENV=production
      - VISIT_COUNTER_PATH=/app/data/visits.json
      - CHECKOUT_DATA_DIR=/app/data/checkout
      - CHECKOUT_ORDERS_PATH=/app/data/checkout/orders.json
      - A4_BUNDLE_PATH=/app/delivery/personal-stack-agent-starter-v0.3.zip
    volumes:
      - site_data:/app/data
      - ./data/checkout:/app/data/checkout
      - ./dist:/app/delivery:ro
    expose:
      - "3000"
    networks:
      - stack

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    networks:
      - stack

volumes:
  caddy_data:
  caddy_config:
  redis_data:
  site_data:

networks:
  stack:
    driver: bridge
