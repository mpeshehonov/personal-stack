services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - site
    networks:
      - stack

  site:
    build:
      context: ./site
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - VISIT_COUNTER_PATH=/app/data/visits.json
    volumes:
      - site_data:/app/data
    expose:
      - "3000"
    networks:
      - stack

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    networks:
      - stack

volumes:
  caddy_data:
  caddy_config:
  redis_data:
  site_data:

networks:
  stack:
    driver: bridge
