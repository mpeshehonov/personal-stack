name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-personal-stack
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        if: ${{ secrets.DEPLOY_HOST != '' && secrets.DEPLOY_USER != '' && secrets.DEPLOY_KEY != '' }}
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            set -euo pipefail
            cd "${{ secrets.DEPLOY_PATH || '/opt/personal-stack' }}"
            ./scripts/deploy-from-git.sh

      - name: Skip when secrets not configured
        if: ${{ secrets.DEPLOY_HOST == '' || secrets.DEPLOY_USER == '' || secrets.DEPLOY_KEY == '' }}
        run: |
          echo "Add DEPLOY_HOST, DEPLOY_USER, and DEPLOY_KEY repository secrets to enable auto-deploy."
          echo "See docs/DEPLOY.md"
