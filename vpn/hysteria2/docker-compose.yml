services:
  hysteria2-36712:
    image: tobyxdd/hysteria:latest
    container_name: hysteria2-nl-36712
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./config-36712.yaml:/etc/hysteria/config.yaml:ro
      - ./certs:/etc/hysteria/certs:ro
    command: ["server", "-c", "/etc/hysteria/config.yaml"]

  hysteria2-8443:
    image: tobyxdd/hysteria:latest
    container_name: hysteria2-nl-8443
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./config-8443.yaml:/etc/hysteria/config.yaml:ro
      - ./certs:/etc/hysteria/certs:ro
    command: ["server", "-c", "/etc/hysteria/config.yaml"]

  hysteria2-443:
    image: tobyxdd/hysteria:latest
    container_name: hysteria2-nl-443
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./config-443.yaml:/etc/hysteria/config.yaml:ro
      - ./certs:/etc/hysteria/certs:ro
    command: ["server", "-c", "/etc/hysteria/config.yaml"]

  hy2-subscription:
    image: nginx:alpine
    container_name: hy2-subscription
    restart: unless-stopped
    ports:
      - "8888:80"
    volumes:
      - ./subscription:/usr/share/nginx/html:ro
